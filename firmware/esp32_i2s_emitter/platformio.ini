[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.0.0
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

[env:esp32_c3_super_mini]

[env:hardware_test]
build_flags =
  ${env.build_flags}
  -D ALIVE_HARDWARE_TEST=1
